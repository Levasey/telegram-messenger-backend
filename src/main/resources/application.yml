# Порт по умолчанию 9090 — реже конфликтует с другими сервисами на 8080. Переопределение: SERVER_PORT=8080
#
# Базовый профиль (default): настройки для публичного деплоя — без H2 console и без ddl-auto: update.
# Локально: SPRING_PROFILES_ACTIVE=local (см. второй документ ниже и application-local.yml.example).
server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: telegram-messenger-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Токен: TELEGRAM_BOT_TOKEN (переменная окружения) или telegram.bot.token в application-local.yml при профиле local
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    # Секрет для setWebhook (secret_token); Telegram шлёт его в X-Telegram-Bot-Api-Secret-Token. Пустой — без проверки.
    webhook-secret-token: ${TELEGRAM_WEBHOOK_SECRET:}
    # Плейсхолдер {name} — имя пользователя в Telegram
    welcome-message: "Добро пожаловать, {name}! Рады видеть вас."
  school:
    time-zone: ${TELEGRAM_SCHOOL_TIMEZONE:Europe/Moscow}
    reminder-cron: ${TELEGRAM_SCHOOL_REMINDER_CRON:0 0 9 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
# Локальная разработка: in-memory H2, консоль /h2-console, автосхема через Hibernate
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:telegram;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
