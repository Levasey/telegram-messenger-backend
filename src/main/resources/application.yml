# Порт по умолчанию 9090 — реже конфликтует с другими сервисами на 8080. Переопределение: SERVER_PORT=8080
server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: telegram-messenger-backend
  # Локально: SPRING_PROFILES_ACTIVE=local и файл application-local.yml (см. application-local.yml.example)
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: jdbc:h2:mem:telegram;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Токен: TELEGRAM_BOT_TOKEN (переменная окружения) или telegram.bot.token в application-local.yml при профиле local
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
